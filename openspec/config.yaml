schema: spec-driven

context: |
  Project: conteo-eficiente
  Authoritative agent contract: AGENTS.md (repo root) — read it first, this
  config does not restate it, only records testing/commands for SDD phases.
  Reading order mandated by AGENTS.md §0: README.md -> docs/diseno/README.md
  (13 design docs, authoritative) -> the specific design doc for the touched
  area -> docs/PRODUCT.md + docs/DESIGN.md + docs/plan-diseno-visual-pwa.md
  for UI changes. If code contradicts a doc, the doc wins; fix the doc in the
  same commit rather than leaving the divergence live.

  Tech stack: npm workspaces monorepo (Node 22, pinned via .nvmrc — Cloud
  Functions v2 does not support runtime 24), TypeScript 5.5, ESM (`"type":
  "module"` everywhere).
    - apps/web (@conteo/web): React 19 + Vite 6 + react-router-dom 7 +
      Tailwind CSS 4 + vite-plugin-pwa. Firebase Web SDK 11.
    - packages/functions (@conteo/functions): Firebase Cloud Functions v2
      (firebase-functions 5, firebase-admin 12), zod 4 for validation, Node
      22 engine pinned.
    - packages/data (@conteo/data): Firestore client access layer — per
      AGENTS.md §5 dependency rule, ONLY this package touches the Firebase
      SDK (enforced by ESLint).
    - packages/shared (@conteo/shared): framework-agnostic domain/shared code,
      imports nothing from the rest of the project.
    - contracts (@conteo/contracts): zod schemas shared between web and
      functions.
    - tools (@conteo/tools): seed script (`node --experimental-strip-types`).
    - infra/: firebase.json, firestore.rules, firestore.indexes.json,
      storage.rules, infra/test (rules tests).

  Architecture: dependency rule (AGENTS.md §5) — arrows point down. `shared`
  imports nothing project-local; `data` imports `shared` + `contracts`;
  `apps/web` imports everything. Only `packages/data` touches the Firebase
  SDK directly. Domain vocabulary is in Spanish (SesionConteo, LineaConteo,
  aporte, sucursal) per the design docs — code, domain names, and docs stay
  Spanish; only SDD artifacts generated by this pipeline are English.
  Guiding principle (non-negotiable, per README): the client never writes a
  total, it only declares its contribution ("aporte").

  Testing: Strict TDD is mandatory (AGENTS.md §2) — red before green, test
  written first and must fail for the correct reason. Every non-trivial unit
  (branch, loop, parser, money, security) needs a test; trivial one-liners
  don't. A negative test that would also pass with the rule broken proves
  nothing — every rule needs an affirmative counterpart. Tests under
  apps/web/src fix the rendered markup (visual-redesign regression net) —
  if a change breaks many of them, the change is the suspect, not the tests.

  Style: RDD (adversarial review) gates the repo before commit (AGENTS.md
  §3) — mutating normalizers (format/lint --fix/generation) run before
  START, only non-mutating checks run after. One correction transaction per
  candidate. Conventional commits in Spanish, no AI attribution, one commit
  per reviewable work unit.

testing:
  strict_tdd: true
  package_manager: npm (npm workspaces, root package.json)
  before_closing_any_unit: "npm run typecheck && npm run lint && npm test"
  before_closing_firestore_rules_change: "npm run test:rules"
  commands:
    root:
      typecheck: "npm run typecheck --workspaces --if-present"
      lint: "eslint ."
      test_all: "npm run test --workspaces --if-present"
      build: "npm run build --workspaces --if-present"
      emulators_start: "firebase emulators:start --config infra/firebase.json"
      test_rules: 'firebase emulators:exec --config infra/firebase.json --project demo-conteo-eficiente --only firestore "vitest run infra/test"'
    apps/web:
      test: "vitest run"
      typecheck: "tsc -p tsconfig.json"
      build: "vite build"
    packages/functions:
      # Verbatim from packages/functions/package.json — runs against the
      # Firebase emulator (firestore + auth), NOT plain vitest.
      test: 'firebase emulators:exec --config ../../infra/firebase.json --project demo-conteo-eficiente --only firestore,auth "vitest run"'
      typecheck: "tsc -p tsconfig.json"
    packages/data:
      test: "vitest run"
      typecheck: "tsc -p tsconfig.json"
    packages/shared:
      test: "vitest run"
      typecheck: "tsc -p tsconfig.json"
    contracts:
      test: "vitest run"
      typecheck: "tsc -p tsconfig.json"
    tools:
      typecheck: "tsc -p tsconfig.json"
      # no test script — seed utility only
  ci_reference: .github/workflows/ci.yml
  ci_notes: |
    Path-filtered monorepo CI (dorny/paths-filter): jobs `web`, `contratos`,
    `functions`, `reglas` only run when their paths changed.
    - `functions` and `reglas` jobs additionally set up Java 17 (temurin) —
      the Firebase emulator needs a JVM.
    - `functions` job pins Node to "22" explicitly (not .nvmrc) with the same
      comment as AGENTS.md §5: Cloud Functions v2 doesn't support runtime 24.
    - `reglas` (firestore.rules) job runs `npm run test:rules`; AGENTS.md
      calls this the one irreversible-failure-mode gate (a bad rule opens the
      whole database) — rules changes must not be deployed if their tests fail.
  node_version: "22 (.nvmrc; Cloud Functions v2 constraint)"
  linter: "eslint . (eslint.config.js, flat config, enforces the dependency
    rule so only packages/data touches the Firebase SDK)"
  formatter: prettier (npm run format)
  review_gate: "gentle-ai review — RDD, mandatory before commit (AGENTS.md §3)"

rules:
  proposal:
    - Read AGENTS.md and the relevant docs/diseno/{NN}-*.md doc(s) before
      scoping; if the change touches UI also read docs/PRODUCT.md,
      docs/DESIGN.md, docs/plan-diseno-visual-pwa.md.
    - State which design doc(s) the proposal touches or contradicts; if it
      contradicts one, the proposal must include updating that doc in the
      same change.
    - Respect the dependency rule (shared -> data -> apps/web) when scoping
      affected packages.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Domain vocabulary in requirement text may keep the repo's Spanish
      domain terms (SesionConteo, LineaConteo, aporte, sucursal) verbatim
      even though the surrounding spec prose is English.
  design:
    - Document architecture decisions with rationale, consistent with
      docs/diseno/13-decisiones-adr.md conventions.
    - Include sequence diagrams for concurrency/offline flows (see
      docs/diseno/05-concurrencia-offline-tiempo-real.md).
  tasks:
    - Group by phase, hierarchical numbering, one deliverable work unit per
      commit (AGENTS.md §5, work-unit-commits skill).
    - Each unit must specify its red test before its implementation (strict
      TDD is non-negotiable for this repo).
    - Flag any task touching infra/firestore.rules as requiring
      `npm run test:rules` before that unit closes.
    - Forecast the 400-line review budget per PR/slice (see review budget
      below); recommend chained PRs when a slice risks exceeding it.
  apply:
    guidelines:
      - Follow the existing dependency rule and Spanish domain naming.
      - Red -> green -> refactor per unit; do not batch multiple units'
        tests together.
    tdd: true
    test_command: "npm run typecheck && npm run lint && npm test"
  verify:
    test_command: "npm run typecheck && npm run lint && npm test"
    build_command: "npm run build --workspaces --if-present"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
    - If a change updated a docs/diseno doc to resolve a code/doc
      contradiction, confirm the doc edit landed before archiving.

review_budget:
  lines_per_pr: 400
  count: "additions + deletions, authored text only (generated goldens excluded)"
  delivery_strategy: auto-chain
  chain_strategy: deferred-to-sdd-tasks
  note: total across a chained series is uncapped by user decision; the
    400-line cap applies per chained PR/slice, not to the whole change.
