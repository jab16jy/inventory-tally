name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# El permiso por defecto del repo es sólo "read", que en Actions equivale a
# contents:read — no incluye pull-requests:read. Sin esto, dorny/paths-filter
# no puede listar los ficheros del PR y falla con "Resource not accessible by
# integration" en TODO pull_request, sea cual sea el contenido.
permissions:
  contents: read
  pull-requests: read

# Cancela ejecuciones previas de la misma rama: el monorepo tarda y no vale la
# pena pagar dos veces por un commit que ya quedó obsoleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El monorepo hace el CI más largo (doc 12 §2), así que cada job se ejecuta
  # sólo si sus rutas cambiaron.
  #
  # Excepción: un push de tag. dorny/paths-filter, sin `base:`, diffea contra
  # el merge-base con la rama por defecto — y un tag de release apunta a un
  # commit que YA está en main, así que ese merge-base es el propio commit y
  # el diff sale vacío. Sin este `startsWith(...)` los 4 outputs darían
  # "false", saltando web/web-e2e/contratos/functions/reglas (skipped, no
  # failed) y dejando a deploy-prod avanzar sin haber corrido un solo test.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ startsWith(github.ref, 'refs/tags/v') || steps.filtro.outputs.web == 'true' }}
      functions: ${{ startsWith(github.ref, 'refs/tags/v') || steps.filtro.outputs.functions == 'true' }}
      reglas: ${{ startsWith(github.ref, 'refs/tags/v') || steps.filtro.outputs.reglas == 'true' }}
      contratos: ${{ startsWith(github.ref, 'refs/tags/v') || steps.filtro.outputs.contratos == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/data/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'tsconfig.base.json'
            functions:
              - 'packages/functions/**'
              - 'packages/shared/**'
              - 'contracts/**'
            reglas:
              - 'infra/**'
            contratos:
              - 'contracts/**'

  web:
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace apps/web
      - run: npm run test --workspace packages/data
      - run: npm run build --workspace apps/web

  # E2E de Playwright contra el Emulator Suite (auth + firestore): mismo
  # filtro de rutas que `web` — cubre exactamente lo que este job ejercita en
  # el navegador. Java porque los emuladores son JVM, igual que el job `reglas`.
  web-e2e:
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contratos:
    needs: cambios
    if: needs.cambios.outputs.contratos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test --workspace contracts
      - run: npm run test --workspace packages/shared

  functions:
    needs: cambios
    if: needs.cambios.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, no la versión local: Cloud Functions v2 no soporta runtime 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Los emuladores de Firebase necesitan una JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run typecheck --workspace packages/functions
      - run: npm run test --workspace packages/functions

  # Regla de oro (doc 12 §2): las Security Rules no se despliegan si sus tests
  # fallan. Una regla mal desplegada abre la base de datos entera y es el único
  # fallo de este sistema con consecuencias irreversibles.
  reglas:
    needs: cambios
    if: needs.cambios.outputs.reglas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run test:rules

  # Este job corre siempre en cada push a main, sin importar qué cambió: los
  # índices, las reglas, las functions y el hosting de dev deben avanzar
  # juntos, porque desplegar sólo el trozo que cambió los dejaría desalineados
  # entre sí (p. ej. una function nueva que depende de un índice que no se
  # desplegó).
  #
  # `if: !cancelled() && !failure()` en vez de confiar en el `needs:` a secas:
  # la condición por defecto de un job es `success()`, que da false si
  # cualquier dependencia de `needs` quedó en estado `skipped` (no sólo
  # `failure`). Como dorny/paths-filter salta `web`/`contratos`/`functions`
  # en un push que sólo toca `infra/`, un `needs:` a secas saltaría también
  # este job de deploy en silencio. `!failure()` sigue bloqueando ante un
  # fallo real (p. ej. `reglas` fallando su `test:rules`); `!cancelled()`
  # bloquea si el run quedó obsoleto por un push más nuevo (el `concurrency`
  # del propio workflow cancela ejecuciones en curso).
  deploy-dev:
    needs: [cambios, web, web-e2e, contratos, functions, reglas]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Autenticar con la service account de dev
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/firebase-sa-dev.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa-dev.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
      # ponytail: sin --force en indexes/rules — un huérfano se limpia a
      # mano; revisar si se acumulan. Auto-borrar sin --force sería riesgo de
      # perder algo que un humano puso ahí a propósito.
      - run: npx firebase deploy --only firestore:indexes --project dev --non-interactive
      - run: npx firebase deploy --only firestore:rules --project dev --non-interactive
      # `functions` sí necesita --force: `onAporteEscrito` tiene política de
      # reintento (`retry: true`), y en modo no-interactivo el CLI corta el
      # deploy pidiendo --force para confirmarla (confirmado en el código
      # fuente de firebase-tools, promptForFailurePolicies). --force también
      # habilita borrar sin preguntar una function que ya no esté en el
      # código — a diferencia de indexes/rules, eso es el comportamiento
      # correcto para functions: una function huérfana sigue facturando.
      - run: npx firebase deploy --only functions --project dev --non-interactive --force
      - run: npm run build --workspace apps/web -- --mode dev
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY_DEV }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID_DEV }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID_DEV }}
      - run: npx firebase deploy --only hosting --project dev --non-interactive
      # ponytail: sin retry/notificación/rollback automático — no lo pide el
      # issue #14, y un deploy fallido debe quedar en rojo para que lo mire
      # una persona, no reintentar solo hacia un estado a medias.

  # Deploy a prod (issue #16, doc 12 §2-3): mismo orden y mismos `needs` de
  # verificación que deploy-dev, disparado por un tag `v*` sobre main en vez
  # de por push a la rama. Irreversible sobre datos reales de inventario.
  deploy-prod:
    needs: [cambios, web, web-e2e, contratos, functions, reglas]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !cancelled() && !failure()
    runs-on: ubuntu-latest
    # Cada tag tiene un `github.ref` distinto, así que el `concurrency` del
    # workflow (línea 19, agrupado por ref) no serializa dos tags pusheados
    # casi juntos: correrían dos deploys a prod en paralelo, irreversibles,
    # contra el mismo proyecto. `cancel-in-progress: false` porque abortar un
    # deploy a mitad de camino es peor que dejarlo encolado.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Un tag es una ref sin protección de rama: cualquiera con permiso de
      # tag-creation podría apuntar un `v*` a un commit fuera de main. Va
      # antes de `npm ci` (no sólo antes de las credenciales de prod): un
      # tag apuntando a un commit ajeno podría traer un `package.json`
      # hostil, y `npm ci` ya ejecuta scripts de instalación.
      #
      # Sin `--depth=N` en el fetch: `checkout@v4` ya trajo el historial
      # completo (`fetch-depth: 0`, arriba); volver a fetchear con
      # `--depth=1` re-shallowea el repo y `merge-base --is-ancestor` da
      # falso negativo para cualquier tag que no sea la punta exacta de
      # main (verificado: reproducido localmente).
      - name: Verificar que el tag esté sobre main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::El tag ${GITHUB_REF_NAME} no apunta a un commit de main."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Autenticar con la service account de prod
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_PROD" > "$RUNNER_TEMP/firebase-sa-prod.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa-prod.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      - run: npx firebase deploy --only firestore:indexes --project prod --non-interactive
      - run: npx firebase deploy --only firestore:rules --project prod --non-interactive
      # --force: misma razón que en deploy-dev (política de reintento de
      # onAporteEscrito exige confirmación en modo no-interactivo).
      - run: npx firebase deploy --only functions --project prod --non-interactive --force
      - run: npm run build --workspace apps/web -- --mode prod
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY_PROD }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN_PROD }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID_PROD }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET_PROD }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID_PROD }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID_PROD }}
      - run: npx firebase deploy --only hosting --project prod --non-interactive

  # Canal de preview de Firebase Hosting por PR (issue #15, doc 12 §3): sólo
  # hosting, nunca reglas/índices/functions — el equipo de pruebas necesita
  # ver el cambio de UI, no un entorno completo. Corre en todo PR, no sólo si
  # `web` cambió: el acceptance criteria pide URL en cada PR, y el `!failure()`
  # sigue bloqueando si `web` sí corrió y falló.
  preview:
    needs: [cambios, web]
    if: >-
      github.event_name == 'pull_request' &&
      !cancelled() && !failure()
    runs-on: ubuntu-latest
    # El repo sólo da pull-requests:read por defecto (línea 14); esta action
    # comenta la URL de preview en el PR (pull-requests: write) y publica un
    # check-run "Deploy Preview" del progreso del deploy (checks: write) —
    # sin este último falla con 403 "Resource not accessible by integration"
    # al crear el check-run, confirmado en el log del run que falló.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/web -- --mode dev
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY_DEV }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN_DEV }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID_DEV }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET_DEV }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID_DEV }}
      # Sólo toca Hosting (a diferencia de `npx firebase deploy`): la action
      # crea/actualiza un canal por PR, comenta su URL y lo expira sola — sin
      # esto habría que parsear `hosting:channel:deploy --json` a mano.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          projectId: dev
          expires: 7d
